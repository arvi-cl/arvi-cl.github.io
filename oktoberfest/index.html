<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparte tu momento ARVI Oktoberfest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#7ac943;--deep:#3d8c1f;--ink:#214014}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:600 17px/1.45 Nunito,sans-serif;background:
  radial-gradient(circle at 8% 0,rgba(122,201,67,.45),transparent 28%),
  linear-gradient(180deg,#f4ffe8,#e7f8d4)}
h1,button{font-family:"Baloo 2",sans-serif}
.wrap{max-width:760px;margin:auto;padding:24px 16px 48px}
.hero{text-align:center}
.logo{width:min(280px,70vw);height:auto}
h1{font-size:clamp(32px,7vw,52px);line-height:.95;margin:8px 0}
.lead{margin:6px auto 0;max-width:28ch;font-size:18px}
.personajes{width:min(520px,100%);height:auto;margin-top:8px;filter:drop-shadow(0 12px 0 rgba(61,140,31,.12))}
.card{background:#fff;border:3px solid #d7efc0;border-radius:28px;padding:18px;margin-top:8px;box-shadow:0 12px 30px rgba(61,140,31,.08)}
.drop{border:3px dashed var(--green);border-radius:20px;padding:22px;text-align:center;background:#f7fff0;cursor:pointer}
.drop strong{display:block;font-size:20px}
.preview{display:none;margin-top:12px;border-radius:16px;max-height:280px;width:100%;object-fit:cover}
.btn{display:block;width:100%;border:0;border-radius:999px;margin-top:14px;padding:14px;font-size:20px;font-weight:800;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--deep);cursor:pointer;text-align:center;text-decoration:none}
.btn.google{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d7efc0;border:2px solid #d7efc0}
.btn:disabled{opacity:.55}
.ok{display:none;text-align:center;font-weight:800;color:var(--deep)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img class="logo" src="logo.png" alt="ARVI.cl entretenciones infantiles">
    <h1>Comparte tu momento ARVI Oktoberfest</h1>
    <p class="lead">Sácate una foto en los juegos y déjala aquí.</p>
    <img class="personajes" src="personajes.png" alt="Personajes de ARVI en el Oktoberfest">
  </header>
  <form class="card" id="f">
    <div class="drop" id="drop">Elige tu foto<strong>En los juegos, la fila o celebrando</strong></div>
    <input id="file" type="file" accept="image/*" required hidden>
    <img class="preview" id="preview" alt="">
    <button class="btn" id="send" type="submit">Subir mi foto</button>
    <p class="ok" id="ok">¡Listo! Recibimos tu foto.</p>
    <a class="btn google" href="https://www.google.com/search?q=ARVI.cl+entretenciones+infantiles" target="_blank" rel="noopener">Déjanos una reseña en Google</a>
  </form>
</div>
<script>
const API="https://crudcrud.com/api/ffaa521ceace44a5a4782bf6b799e118/fotos";
const file=document.getElementById("file"), drop=document.getElementById("drop"), preview=document.getElementById("preview");
drop.onclick=()=>file.click();
drop.ondragover=e=>e.preventDefault();
drop.ondrop=e=>{e.preventDefault(); if(e.dataTransfer.files[0]){file.files=e.dataTransfer.files; show()}};
file.onchange=show;
function show(){const f=file.files[0]; if(!f)return; preview.src=URL.createObjectURL(f); preview.style.display="block"}
function shrink(f){return new Promise(res=>{const img=new Image(); img.onload=()=>{const c=document.createElement("canvas"); const max=1400; let w=img.width,h=img.height; if(w>max||h>max){const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s)} c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); res(c.toDataURL("image/jpeg",.82))}; img.src=URL.createObjectURL(f)})}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();
  if(!file.files[0]) return;
  const btn=document.getElementById("send"); btn.disabled=true; btn.textContent="Subiendo...";
  try{
    const foto=await shrink(file.files[0]);
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:"",nota:"Oktoberfest",foto,cuando:new Date().toISOString()})});
    if(!r.ok) throw new Error("falló");
    document.getElementById("ok").style.display="block";
    e.target.reset(); preview.style.display="none";
    btn.textContent="Subir otra foto";
  }catch(err){alert("No se pudo guardar la foto. Intenta de nuevo."); btn.textContent="Subir mi foto"}
  btn.disabled=false;
};
</script>
</body>
</html>
