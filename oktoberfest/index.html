<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparte tu momento ARVI Oktoberfest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#7ac943;--deep:#2f7a18;--ink:#214014}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:600 17px/1.45 Nunito,sans-serif;background:linear-gradient(180deg,#f3ffe8 0%,#e5f6cf 100%)}
h1,h2,a.btn{font-family:"Baloo 2",sans-serif}
.wrap{max-width:820px;margin:auto;padding:22px 16px 56px}
.plate{background:#000;border-radius:28px;margin:14px auto;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.logo-plate{max-width:520px;animation:in .5s ease}
.hero-plate{max-width:720px;animation:float 5s ease-in-out infinite}
.plate img{display:block;width:100%;height:auto;background:#000}
h1{text-align:center;font-size:clamp(32px,7vw,54px);line-height:.95;margin:0}
.lead{text-align:center;margin:8px auto 0;max-width:28ch}
.escena{display:block;width:min(680px,100%);margin:16px auto 0;border-radius:32px;box-shadow:0 18px 40px rgba(47,122,24,.18);animation:in .6s ease}
.review{margin-top:-28px;position:relative;background:#fff;border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 16px 36px rgba(47,122,24,.12);animation:in .7s ease}
.stars{color:#f4b000;font-size:28px;letter-spacing:4px}
.btn{display:block;border-radius:999px;padding:16px 18px;font-size:24px;font-weight:800;text-decoration:none;text-align:center}
.btn.google{color:#fff;background:linear-gradient(90deg,#8ed84a,var(--green));box-shadow:0 6px 0 var(--deep);animation:pulse 2.2s ease-in-out infinite}
.btn.wa{margin-top:14px;color:#fff;background:#25d366;box-shadow:0 5px 0 #128c7e;font-size:18px}
.card{background:#fff;border-radius:24px;padding:16px;margin-top:16px;animation:in .8s ease}
.drop{border:2px dashed #b7e39a;border-radius:16px;padding:16px;text-align:center;cursor:pointer;background:#f7fff0}
.preview{display:none;width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-top:10px}
.send{width:100%;border:0;border-radius:999px;margin-top:10px;padding:12px;font:800 18px "Baloo 2",sans-serif;color:var(--deep);background:#e9f8d8;cursor:pointer}
.ok{display:none;text-align:center;font-weight:800;color:var(--deep)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:translateY(-2px) scale(1.02)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="plate logo-plate"><img src="logo.png?v=4" alt="ARVI.cl entretenciones infantiles"></div>
  <h1>Comparte tu momento ARVI Oktoberfest</h1>
  <p class="lead">Sácate una foto en los juegos y déjala aquí.</p>
  <div class="plate hero-plate"><img src="personajes.png?v=4" alt="Personajes de ARVI en el Oktoberfest"></div>
  <section class="review">
    <div class="stars" aria-hidden="true">★★★★★</div>
    <h2>¿Te gustó ARVI?</h2>
    <p>Tu reseña ayuda a otras familias a encontrarnos.</p>
    <a class="btn google" href="https://www.google.com/search?q=ARVI.cl+entretenciones+infantiles" target="_blank" rel="noopener">Déjanos una reseña en Google</a>
  </section>
  <a class="btn wa" href="https://api.whatsapp.com/send/?phone=56988082320&text=Hola%20ARVI!%20Quiero%20cotizar%20para%20mi%20evento" target="_blank" rel="noopener">¿Te interesa llevar ARVI a tu evento? Cotiza por WhatsApp</a>
  <form class="card" id="f">
    <div class="drop" id="drop">Sube tu foto de los juegos</div>
    <input id="file" type="file" accept="image/*" required hidden>
    <img class="preview" id="preview" alt="">
    <button class="send" id="send" type="submit">Enviar foto</button>
    <p class="ok" id="ok">¡Listo! Recibimos tu foto.</p>
  </form>
</div>
<script>
const API="https://crudcrud.com/api/ffaa521ceace44a5a4782bf6b799e118/fotos";
const file=document.getElementById("file"), drop=document.getElementById("drop"), preview=document.getElementById("preview");
drop.onclick=()=>file.click();
file.onchange=()=>{if(!file.files[0])return; preview.src=URL.createObjectURL(file.files[0]); preview.style.display="block"};
function shrink(f){return new Promise(res=>{const img=new Image(); img.onload=()=>{const c=document.createElement("canvas"); const max=1400; let w=img.width,h=img.height; if(Math.max(w,h)>max){const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s)} c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); res(c.toDataURL("image/jpeg",.82))}; img.src=URL.createObjectURL(f)})}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault(); if(!file.files[0]) return;
  const btn=document.getElementById("send"); btn.disabled=true; btn.textContent="Enviando...";
  try{
    const foto=await shrink(file.files[0]);
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:"",nota:"Oktoberfest",foto,cuando:new Date().toISOString()})});
    if(!r.ok) throw new Error("falló");
    document.getElementById("ok").style.display="block"; e.target.reset(); preview.style.display="none"; btn.textContent="Enviar otra foto";
  }catch(err){alert("No se pudo guardar la foto. Intenta de nuevo."); btn.textContent="Enviar foto"}
  btn.disabled=false;
};
</script>
</body>
</html>
